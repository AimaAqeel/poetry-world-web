<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Poetry World</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        :root {
            --dark-brown: #2f241a;
            --light-brown: #6d584a;
            --accent-brown: #d4bda5;
            --text-light: #f5e6e6;
            --error-red: #c43737;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-brown);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .bg-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            background: var(--accent-brown);
            filter: blur(60px);
            z-index: 0;
        }

        .bg-element-1 {
            width: 400px;
            height: 400px;
            top: -200px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .bg-element-2 {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -100px;
            animation: float 6s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .form-container {
            background: rgba(109, 87, 74, 0.2);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(212, 183, 165, 0.1);
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: var(--accent-brown);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            position: relative;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background-color: var(--accent-brown);
            animation: widthGrow 0.8s ease-out forwards;
        }

        @keyframes widthGrow {
            from { width: 0; }
            to { width: 50px; }
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(109, 87, 74, 0.2);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(245, 230, 230, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-pink);
            background: rgba(109, 87, 74, 0.2);
        }

        .form-group .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-pink);
            transition: all 0.3s ease;
        }

        .password-strength {
            height: 4px;
            background: rgba(109, 87, 74, 0.2);
            margin-top: 0.5rem;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength::before {
            content: '';
            display: block;
            height: 100%;
            width: 0;
            background: var(--accent-pink);
            transition: width 0.3s ease;
        }

        .password-strength.weak::before {
            width: 33.33%;
            background: var(--error-red);
        }

        .password-strength.medium::before {
            width: 66.66%;
            background: #ff8800;
        }

        .password-strength.strong::before {
            width: 100%;
            background: #5caf4c;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--accent-brown);
            color: var(--dark-brown);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 165, 0.3);
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
        }

        button:active::after {
            transform: translate(-50%, -50%) scale(2);
            opacity: 0;
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .additional-links {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-light);
        }

        .additional-links a {
            color: var(--accent-brown);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .additional-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 2rem;
                margin: 1rem;
            }

            h2 {
                font-size: 1.8rem;
            }

            .form-group input {
                padding: 0.8rem;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>

    <div class="form-container">
        <h2>Create Account</h2>
        <form id="signupForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Choose username" required>
                <span class="input-icon">👤</span>
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Enter email" required>
                <span class="input-icon">✉️</span>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Create password" required>
                <span class="input-icon">🔒</span>
                <div class="password-strength" id="passwordStrength"></div>
                <div class="error-message" id="passwordError"></div>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="additional-links">
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        // frontend/public/js/signup.js
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();
        
        if (response.ok) {
            console.log('Registration successful, redirecting...');
            window.location.href = data.redirectUrl || '/';
        } else {
            alert(data.error || 'Registration failed');
        }
    } catch (error) {
        console.error('Registration error:', error);
        alert('Registration failed');
    }
});
const passwordInput = document.getElementById('password');
        const strengthIndicator = document.querySelector('.password-strength');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            if (password.length === 0) {
                strengthIndicator.className = 'password-strength';
            } else if (password.length < 6) {
                strengthIndicator.className = 'password-strength weak';
            } else if (password.length < 10) {
                strengthIndicator.className = 'password-strength medium';
            } else {
                strengthIndicator.className = 'password-strength strong';
            }
        });

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const button = this.querySelector('button');
            button.classList.add('loading');
            setTimeout(() => button.classList.remove('loading'), 2000);
        });

        // Add this to your app.js file
const cursor = document.createElement('div');
cursor.className = 'custom-cursor';
document.body.appendChild(cursor);

const cursorOutline = document.createElement('div');
cursorOutline.className = 'custom-cursor-outline';
document.body.appendChild(cursorOutline);

document.addEventListener('mousemove', (e) => {
    // Update cursor position
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    
    // Update outline position with smooth animation
    cursorOutline.animate({
        left: `${e.clientX}px`,
        top: `${e.clientY}px`
    }, {
        duration: 500,
        fill: "forwards"
    });
});

// Add hover effect for interactive elements
const interactiveElements = document.querySelectorAll('a, button, .nav__link, .cast__card, .gallery__grid img, .connect__socials a, .nav__btn');

interactiveElements.forEach(element => {
    element.addEventListener('mouseenter', () => {
        cursor.classList.add('cursor-hover');
        cursorOutline.classList.add('cursor-hover');
    });
    
    element.addEventListener('mouseleave', () => {
        cursor.classList.remove('cursor-hover');
        cursorOutline.classList.remove('cursor-hover');
    });
});

// Add click effect
document.addEventListener('mousedown', () => {
    cursor.classList.add('cursor-clicking');
    cursorOutline.classList.add('cursor-outline-clicking');
});

document.addEventListener('mouseup', () => {
    cursor.classList.remove('cursor-clicking');
    cursorOutline.classList.remove('cursor-outline-clicking');
});

// Hide cursor when leaving the window
document.addEventListener('mouseout', () => {
    cursor.style.display = 'none';
    cursorOutline.style.display = 'none';
});

document.addEventListener('mouseover', () => {
    cursor.style.display = 'block';
    cursorOutline.style.display = 'block';
});
    </script>
</body>
</html>
